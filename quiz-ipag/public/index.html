<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz reprise d'entreprise</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#0F1C2C; --bronze:#9D8763; --sand:#F4F0E8; --line:#E2DACB; --ok:#2E7D32; --ko:#B3261E; --bg:#FFFFFF; --muted:#6B6B6B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial, Helvetica, sans-serif; font-size:17px; line-height:1.4; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:3px solid var(--bronze); }
  header img { height:40px; width:40px; }
  header .t { font-size:14px; color:var(--muted); text-align:center; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:24px; color:var(--bronze); margin:8px 0 12px; }
  .q { font-size:20px; font-weight:bold; margin:6px 0 18px; }
  .num { color:var(--bronze); font-weight:bold; font-size:15px; }
  input { width:100%; font:inherit; padding:14px; border:2px solid var(--line); border-radius:10px; }
  input:focus { outline:none; border-color:var(--bronze); }
  button { font:inherit; cursor:pointer; }
  .main-btn { width:100%; margin-top:14px; padding:14px; border:0; border-radius:10px; background:var(--ink); color:#fff; font-weight:bold; }
  .main-btn:disabled { opacity:.5; }
  .opt { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; margin:0 0 10px; padding:14px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .opt b { color:var(--bronze); min-width:18px; }
  .opt.chosen { border-color:var(--ink); background:var(--sand); }
  .opt.good { border-color:var(--ok); background:#EAF4EA; }
  .opt.bad { border-color:var(--ko); background:#FBEAEA; }
  .opt:disabled { cursor:default; }
  .card { background:var(--sand); border-radius:12px; padding:18px; margin:14px 0; }
  .verdict { font-size:26px; font-weight:bold; margin:0 0 6px; }
  .verdict.ok { color:var(--ok); } .verdict.ko { color:var(--ko); }
  .big { font-size:48px; font-weight:bold; color:var(--bronze); margin:4px 0; }
  .muted { color:var(--muted); font-size:15px; }
  .err { color:var(--ko); font-size:15px; min-height:20px; margin-top:8px; }
  a.pdf { display:block; text-align:center; text-decoration:none; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bronze); animation:p 1.2s infinite; margin-right:8px; }
  @keyframes p { 50% { opacity:.25; } }
</style>
</head>
<body>
<header>
  <img src="logo-irce.png" alt="IRCE">
  <div class="t">IPAG · Reprise d'entreprise<br>Bloc 2 · Quiz final</div>
  <img src="logo-eurallia.png" alt="Eurallia Finance Marseille">
</header>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const K = "quiz-ipag-id";
let id = null;
try { id = localStorage.getItem(K); } catch (e) {}
if (!id) {
  id = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
  try { localStorage.setItem(K, id); } catch (e) {}
}
let last = "", sending = false, joined = false;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const L = "ABCD";

async function api(path, body) {
  const r = await fetch("/api/" + path, body ? { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erreur réseau");
  return j;
}

function renderJoin(err) {
  app.innerHTML = `
    <h1>Bienvenue</h1>
    <p>Entrez votre prénom pour participer. Vous verrez votre score à la fin ; seul le podium des trois premiers est affiché à l'écran.</p>
    <input id="name" maxlength="30" autocomplete="given-name" placeholder="Votre prénom">
    <button class="main-btn" id="go">Participer</button>
    <div class="err">${err ? esc(err) : ""}</div>`;
  const inp = document.getElementById("name"), go = document.getElementById("go");
  const send = async () => {
    const name = inp.value.trim();
    if (!name) { renderJoin("Le prénom est obligatoire."); return; }
    go.disabled = true;
    try { await api("join", { id, name }); joined = true; last = ""; poll(true); }
    catch (e) { renderJoin(e.message); }
  };
  go.onclick = send;
  inp.onkeydown = e => { if (e.key === "Enter") send(); };
  inp.focus();
}

function render(s) {
  const key = JSON.stringify([s.phase, s.q, s.mine, s.score, s.name]);
  if (key === last) return;
  last = key;
  if (s.phase === "lobby") {
    app.innerHTML = `<h1>Bonjour ${esc(s.name)}</h1><div class="card"><span class="dot"></span>Le quiz va commencer. Gardez cette page ouverte.</div>`;
    return;
  }
  if (s.phase === "end") {
    app.innerHTML = `
      <h1>Quiz terminé, ${esc(s.name)}</h1>
      <div class="card"><div class="muted">Votre score</div><div class="big">${s.score} / ${s.total}</div></div>
      <p>Retrouvez toutes les questions, les réponses commentées et les sources dans le document du quiz.</p>
      <a class="main-btn pdf" href="quiz-ipag-bloc2.pdf" download>Télécharger le quiz (PDF)</a>`;
    return;
  }
  const qn = s.q, Q = s.question, reveal = s.phase === "reveal";
  const opts = Q.options.map((o, i) => {
    let cls = "opt";
    if (reveal) cls += i === s.answer ? " good" : (i === s.mine ? " bad" : "");
    else if (i === s.mine) cls += " chosen";
    return `<button class="${cls}" data-i="${i}" ${s.mine !== null || reveal ? "disabled" : ""}><b>${L[i]}</b><span>${esc(o)}</span></button>`;
  }).join("");
  let foot = "";
  if (reveal) {
    const ok = s.mine === s.answer;
    foot = `<div class="card"><p class="verdict ${ok ? "ok" : "ko"}">${s.mine === null ? "Pas de réponse" : ok ? "Juste !" : "Faux"}</p>
      <div class="muted">Votre score : ${s.score} / ${qn + 1}</div></div>
      <p class="muted"><span class="dot"></span>Écoutez l'explication, la question suivante arrive.</p>`;
  } else if (s.mine !== null) {
    foot = `<p class="muted"><span class="dot"></span>Réponse enregistrée. Attendez la correction.</p>`;
  }
  app.innerHTML = `<div class="num">Question ${qn + 1} / ${s.total}</div><div class="q">${esc(Q.q)}</div>${opts}${foot}<div class="err" id="err"></div>`;
  app.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = async () => {
    if (sending) return;
    sending = true;
    const c = +b.dataset.i;
    app.querySelectorAll(".opt").forEach(x => { x.disabled = true; x.classList.toggle("chosen", x === b); });
    try { await api("answer", { id, q: qn, c }); last = ""; await poll(true); }
    catch (e) { document.getElementById("err").textContent = e.message; last = ""; }
    sending = false;
  });
}

let timer = null;
async function poll(once) {
  try {
    const s = await api("state?id=" + id);
    if (!s.joined) { if (!document.getElementById("name")) renderJoin(); }
    else render(s);
  } catch (e) { /* réseau : on réessaie au prochain tour */ }
  if (!once) { clearTimeout(timer); timer = setTimeout(poll, 2500); }
}
poll();
</script>
</body>
</html>
